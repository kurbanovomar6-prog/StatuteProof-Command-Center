  <circle cx="32" cy="32" r="2.0" fill="#00C4FF"/>
  <circle cx="46.1" cy="17.9" r="3.5" fill="none" stroke="#00C4FF" stroke-width="0.9" opacity="0.18"/>
  <circle cx="46.1" cy="17.9" r="1.9" fill="#00C4FF"/>
