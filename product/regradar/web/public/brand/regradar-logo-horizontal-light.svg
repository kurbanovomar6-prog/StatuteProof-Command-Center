<!-- Wordmark — navy on light -->
<text x="158" y="123" fill="#07101E" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="58" font-weight="500"  letter-spacing="0.5">Reg</text>
<text x="258" y="123" fill="#07101E" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="58" font-weight="760" letter-spacing="-1.2">Radar</text>

