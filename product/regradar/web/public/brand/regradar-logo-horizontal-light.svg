  <line x1="32" y1="12"  x2="32" y2="15"  stroke="#3D5878" stroke-width="0.8" stroke-linecap="round" opacity="0.55"/>
  <line x1="32" y1="52"  x2="32" y2="49"  stroke="#3D5878" stroke-width="0.8" stroke-linecap="round" opacity="0.55"/>
  <line x1="52" y1="32"  x2="49" y2="32"  stroke="#3D5878" stroke-width="0.8" stroke-linecap="round" opacity="0.55"/>
