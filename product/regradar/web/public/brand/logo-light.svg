<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" fill="none">
  <!-- Light background -->
  <rect width="200" height="48" fill="#F8FAFC"/>

  <!-- Mark on light bg — navy spine/bars, cyan active -->
  <g transform="translate(8, 8)">
    <line x1="5.5" y1="6.5" x2="5.5" y2="25.5" stroke="#0f172a" stroke-width="1.6" stroke-linecap="round" opacity="0.55"/>
    <line x1="5.5" y1="10"   x2="16"   y2="10"   stroke="#0f172a"  stroke-width="1.8" stroke-linecap="round" opacity="0.3"/>
    <line x1="5.5" y1="14"   x2="21.5" y2="14"   stroke="#0f172a"  stroke-width="1.8" stroke-linecap="round" opacity="0.3"/>
    <line x1="5.5" y1="22"   x2="14"   y2="22"   stroke="#0f172a"  stroke-width="1.8" stroke-linecap="round" opacity="0.2"/>
    <line x1="5.5" y1="18" x2="24.5" y2="18" stroke="#0891b2" stroke-width="2" stroke-linecap="round"/>
    <circle cx="24.5" cy="18" r="3.6" stroke="#0891b2" stroke-width="0.8" opacity="0.28"/>
    <circle cx="24.5" cy="18" r="1.9" fill="#0891b2"/>
  </g>

  <!-- Wordmark — navy on light -->
  <text x="52" y="31" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" letter-spacing="-0.5" fill="#0f172a">Reg</text>
  <text x="85" y="31" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" letter-spacing="-0.5" fill="#0891b2">Radar</text>
</svg>
