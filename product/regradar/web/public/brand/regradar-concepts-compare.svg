<svg width="960" height="320" viewBox="0 0 960 320" fill="none" xmlns="http://www.w3.org/2000/svg">

<!-- Comparison of 3 R-monogram concept directions for RegRadar -->
<!-- Background -->
<rect width="960" height="320" fill="#07111F"/>

<!-- ======================================================= -->
<!-- CONCEPT A — Source Record R -->
<!-- ======================================================= -->

<!-- Icon A (scaled 2x from 64x64) centered at x=80 -->
<g transform="translate(48 60) scale(2)">
  <rect x="4" y="4" width="56" height="56" rx="14" fill="#0A1526"/>
  <!-- Source record bars -->
  <rect x="8" y="12"   width="12" height="2.5" fill="white"   opacity="0.32"/>
  <rect x="8" y="16.5" width="9"  height="2.5" fill="white"   opacity="0.28"/>
  <rect x="8" y="21"   width="12" height="2.5" fill="#00C4FF"/>
  <rect x="8" y="25.5" width="7"  height="2.5" fill="white"   opacity="0.22"/>
  <rect x="8" y="30"   width="10" height="2.5" fill="white"   opacity="0.17"/>
  <!-- R -->
  <rect x="22" y="9"  width="9"  height="47" fill="white"/>
  <rect x="31" y="9"  width="22" height="7"  fill="white"/>
  <rect x="47" y="9"  width="7"  height="22" fill="white"/>
  <rect x="31" y="24" width="23" height="7"  fill="white"/>
  <path d="M 22 31 L 31 31 L 54 56 L 45 56 Z" fill="white"/>
</g>

<!-- Label A -->
<text x="176" y="258" fill="#8394AF" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5" text-anchor="middle">A — SOURCE RECORD R</text>
<text x="176" y="275" fill="#4A5870" font-family="Inter, Arial, sans-serif" font-size="11" text-anchor="middle">Reg. source bars + R</text>

<!-- ======================================================= -->
<!-- CONCEPT B — Signal Leg R (RECOMMENDED) -->
<!-- ======================================================= -->

<g transform="translate(368 60) scale(2)">
  <rect x="4" y="4" width="56" height="56" rx="14" fill="#0A1526"/>
  <!-- R white body -->
  <rect x="10" y="8" width="9"  height="48" fill="white"/>
  <rect x="19" y="8" width="25" height="7"  fill="white"/>
  <rect x="41" y="8" width="7"  height="23" fill="white"/>
  <rect x="19" y="24" width="29" height="6" fill="white"/>
  <!-- Cyan leg = detected signal -->
  <path d="M 19 31 L 27 31 L 52 56 L 44 56 Z" fill="#00C4FF"/>
</g>

<text x="496" y="258" fill="#00C4FF" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5" text-anchor="middle">B — SIGNAL LEG R ★</text>
<text x="496" y="275" fill="#4A5870" font-family="Inter, Arial, sans-serif" font-size="11" text-anchor="middle">Cyan leg = detected signal</text>

<!-- ======================================================= -->
<!-- CONCEPT C — Jurisdiction Engine R -->
<!-- ======================================================= -->

<g transform="translate(688 60) scale(2)">
  <rect x="4" y="4" width="56" height="56" rx="14" fill="#0A1526"/>
  <!-- R -->
  <rect x="10" y="8" width="9"  height="48" fill="white"/>
  <rect x="19" y="8" width="24" height="7"  fill="white"/>
  <!-- Segmented right wall -->
  <rect x="43" y="8"    width="7" height="8"   fill="white"/>
  <rect x="43" y="18.5" width="7" height="7"   fill="#00C4FF"/>
  <rect x="43" y="27"   width="7" height="4.5" fill="white"/>
  <rect x="19" y="25"   width="31" height="6"  fill="white"/>
  <path d="M 19 31 L 27 31 L 52 56 L 44 56 Z" fill="white"/>
</g>

<text x="816" y="258" fill="#8394AF" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5" text-anchor="middle">C — JURISDICTION ENGINE R</text>
<text x="816" y="275" fill="#4A5870" font-family="Inter, Arial, sans-serif" font-size="11" text-anchor="middle">Segmented bowl module</text>

</svg>
