<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="6" fill="#0A1526"/>
  <!-- Three rings, halved from 64x64 -->
  <circle cx="16" cy="16" r="10"   stroke="#1E3350" stroke-width="0.75"/>
  <circle cx="16" cy="16" r="6.5"  stroke="#2B4060" stroke-width="0.7"/>
  <circle cx="16" cy="16" r="3.25" stroke="#C4D4E8" stroke-opacity="0.34" stroke-width="0.9"/>
  <!-- Cardinal ticks -->
  <line x1="16" y1="6"    x2="16" y2="7.5"  stroke="#3D5878" stroke-width="0.75" stroke-linecap="round" opacity="0.55"/>
  <line x1="16" y1="26"   x2="16" y2="24.5" stroke="#3D5878" stroke-width="0.75" stroke-linecap="round" opacity="0.55"/>
  <line x1="26" y1="16"   x2="24.5" y2="16" stroke="#3D5878" stroke-width="0.75" stroke-linecap="round" opacity="0.55"/>
  <line x1="6"  y1="16"   x2="7.5"  y2="16" stroke="#3D5878" stroke-width="0.75" stroke-linecap="round" opacity="0.55"/>
  <!-- Detection vector -->
  <line x1="16.9" y1="15.1" x2="22.7" y2="9.3" stroke="#00C4FF" stroke-width="1.3" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="16" cy="16" r="1.1" fill="#00C4FF"/>
  <!-- Active signal -->
  <circle cx="23.05" cy="8.95" r="1.9" stroke="#00C4FF" stroke-width="0.8" opacity="0.18" fill="none"/>
  <circle cx="23.05" cy="8.95" r="1.05" fill="#00C4FF"/>
</svg>
